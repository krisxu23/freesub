name: Update Subscriptions

on:
  schedule:
    # 每天在 UTC 时间 0:00, 6:00, 12:00, 18:00 自动触发更新
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动点击运行
  push:
    # 改动脚本或工作流时立即回归一次
    # (bot 自己提交的是 output/ 与 README.md, 不在下列路径内 → 不会循环触发)
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            # 回推加固: 运行期间远程可能被改动 (网页端编辑 / 其他推送) → push 会被拒。
            # 重试策略: 不做 rebase/merge, 而是「以远程为基准重新提交生成结果」——
            #   reset 到远程后只重新暂存 output/ 与 README.md, 因此:
            #     - 生成文件永远以本次新结果为准, 不可能产生冲突
            #     - 用户对 scripts/ 等文件的改动原样保留 (来自远程的那个提交)
            pushed=0
            for i in 1 2 3; do
              if git push; then
                echo "[+] push 成功 (第 $i 次尝试)"
                pushed=1
                break
              fi
              echo "[!] push 被拒 (远程已变动), 第 $i/3 次重试: 以远程为基准重新提交生成结果"
              git fetch origin main
              git reset -q FETCH_HEAD
              git add -A output/ README.md
              git commit -q -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC" || true
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "[!] 重试 3 次后仍无法推送结果"
              exit 1
            fi
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json socks5.txt residential.txt residential-clash.yaml residential-socks5.txt residential-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country output/socks5-by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"
